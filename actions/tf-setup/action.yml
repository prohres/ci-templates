name: tf-setup
description: >-
  Install Terraform from the repo's .terraform-version, assume the CI role chain via OIDC
  (hub role → target role) and run terraform init with a shared backend config.

inputs:
  working-directory:
    description: Stack directory to init
    required: true
  gha-role-arn:
    description: Role in the CI hub that trusts GitHub OIDC
    required: true
  target-role-arn:
    description: Role chained into from the hub role (where Terraform actually runs)
    required: true
  target-account-id:
    description: Guardrail — fail unless the chained credentials belong to this account
    required: true
  aws-region:
    description: AWS region for the STS endpoint and provider defaults
    default: eu-central-1
  backend-config:
    description: Partial backend config, relative to the repo root
    default: backend.hcl
  version-file:
    description: File with the Terraform version, relative to the repo root
    default: .terraform-version

runs:
  using: composite
  steps:
    # Debug logs print provider API responses (e.g. account emails from Organizations)
    # into the job log, and logs of a public repo are readable by anyone
    - name: Refuse Terraform debug logging
      shell: bash
      run: |
        vars=$(compgen -e | grep -E '^TF_LOG' | grep -vx TF_LOG_PATH || true)
        if [ -n "$vars" ]; then
          echo "::error::Terraform debug logging is not allowed in CI (logs are public): ${vars//$'\n'/, }"
          exit 1
        fi

    - name: Read Terraform version
      id: version
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version-file }}
      run: echo "terraform=$(sed 's/^v//' "$VERSION_FILE")" >> "$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.terraform }}
        terraform_wrapper: false # the wrapper rewrites stdout and exit codes (breaks -detailed-exitcode)

    # Last line of defence for a public repo: a provider error can print a sensitive value in clear text
    # (e.g. an over-long account email). Every later `terraform` call in the job goes through an email mask.
    - name: Mask emails in Terraform output
      shell: bash
      env:
        MASK_DIR: ${{ github.action_path }}/mask
      run: |
        echo "TF_REAL=$(command -v terraform)" >> "$GITHUB_ENV"
        echo "$MASK_DIR" >> "$GITHUB_PATH"

    - name: Assume hub role (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.gha-role-arn }}
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Chain into target role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.target-role-arn }}
        role-chaining: true
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}
        allowed-account-ids: ${{ inputs.target-account-id }}

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BACKEND_CONFIG: ${{ github.workspace }}/${{ inputs.backend-config }}
      run: terraform init -input=false -backend-config="$BACKEND_CONFIG"
