name: tf-setup
description: >-
  Install Terraform from the repo's .terraform-version, assume the CI role chain via OIDC
  (hub role → target role) and run terraform init with a shared backend config.

inputs:
  working-directory:
    description: Stack directory to init
    required: true
  gha-role-arn:
    description: Role in the CI hub that trusts GitHub OIDC
    required: true
  target-role-arn:
    description: Role chained into from the hub role (where Terraform actually runs)
    required: true
  target-account-id:
    description: Guardrail — fail unless the chained credentials belong to this account
    required: true
  aws-region:
    description: AWS region for the STS endpoint and provider defaults
    default: eu-central-1
  backend-config:
    description: Partial backend config, relative to the repo root
    default: backend.hcl
  backend-bucket:
    description: >-
      State bucket, passed to init on top of backend-config; lets a public repo keep the bucket
      name (often derived from an account id) out of git. Empty: the bucket comes from backend-config.
    default: ''
  tf-vars:
    description: >-
      JSON object of extra Terraform variables, exported as TF_VAR_<name> (e.g. account ids from caller
      repo variables). Single-line string values only.
    default: '{}'
  version-file:
    description: File with the Terraform version, relative to the repo root
    default: .terraform-version

runs:
  using: composite
  steps:
    # Debug logs print provider API responses (e.g. account emails from Organizations)
    # into the job log, and logs of a public repo are readable by anyone
    - name: Refuse Terraform debug logging
      shell: bash
      run: |
        vars=$(compgen -e | grep -E '^TF_LOG' | grep -vx TF_LOG_PATH || true)
        if [ -n "$vars" ]; then
          echo "::error::Terraform debug logging is not allowed in CI (logs are public): ${vars//$'\n'/, }"
          exit 1
        fi

    - name: Read Terraform version
      id: version
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version-file }}
      run: echo "terraform=$(sed 's/^v//' "$VERSION_FILE")" >> "$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.terraform }}
        terraform_wrapper: false # the wrapper rewrites stdout and exit codes (breaks -detailed-exitcode)

    # Last line of defence for a public repo: a provider error can print a sensitive value in clear text
    # (e.g. an over-long account email). Every later `terraform` call in the job goes through an email mask.
    - name: Mask emails in Terraform output
      shell: bash
      env:
        MASK_DIR: ${{ github.action_path }}/mask
      run: |
        echo "TF_REAL=$(command -v terraform)" >> "$GITHUB_ENV"
        echo "$MASK_DIR" >> "$GITHUB_PATH"

    - name: Assume hub role (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.gha-role-arn }}
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Chain into target role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.target-role-arn }}
        role-chaining: true
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}
        allowed-account-ids: ${{ inputs.target-account-id }}

    # Stacks that declare variable "account_id" get the guardrail value without a committed tfvars
    # (undeclared TF_VAR_* are ignored, so other stacks are unaffected)
    - name: Export the target account id to Terraform
      shell: bash
      env:
        ACCOUNT_ID: ${{ inputs.target-account-id }}
      run: echo "TF_VAR_account_id=$ACCOUNT_ID" >> "$GITHUB_ENV"

    # Names and values are checked before they reach GITHUB_ENV: a newline would inject another variable
    - name: Export extra Terraform variables
      shell: bash
      env:
        TF_VARS: ${{ inputs.tf-vars }}
      run: |
        jq -e 'type == "object" and all(to_entries[]; (.key | test("^[A-Za-z_][A-Za-z0-9_]*$"))
          and (.value | type == "string" and (test("[\r\n]") | not)))' <<< "$TF_VARS" > /dev/null \
          || { echo "::error::tf-vars must be a JSON object of single-line strings with valid names"; exit 1; }
        jq -r 'to_entries[] | "TF_VAR_\(.key)=\(.value)"' <<< "$TF_VARS" >> "$GITHUB_ENV"

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BACKEND_CONFIG: ${{ github.workspace }}/${{ inputs.backend-config }}
        BACKEND_BUCKET: ${{ inputs.backend-bucket }}
      run: |
        args=(-input=false -backend-config="$BACKEND_CONFIG")
        if [[ -n "$BACKEND_BUCKET" ]]; then args+=(-backend-config="bucket=$BACKEND_BUCKET"); fi
        terraform init "${args[@]}"
