name: tf-plan

# Reusable: static checks (tflint + checkov) once per repo, then fmt / validate / plan per stack
# (optionally only the stacks a PR changed), plan posted as a PR comment (one per stack, updated in place).
# Mark "<caller job> / terraform-ok" as the required check: it reports on every PR, even when no stack is planned.
# The caller must grant: contents: read, id-token: write, pull-requests: write.
on:
  workflow_call:
    inputs:
      stacks:
        description: 'JSON array of stack directories, e.g. ["org", "identity"]'
        type: string
        required: true
      gha-role-arn:
        type: string
        required: true
      target-role-arn:
        type: string
        required: true
      target-account-id:
        type: string
        required: true
      aws-region:
        type: string
        default: eu-central-1
      backend-config:
        type: string
        default: backend.hcl
      tflint-version:
        type: string
        default: v0.65.0
      checkov-version:
        type: string
        default: 3.3.30
      changed-only:
        description: On pull_request, plan only the stacks whose paths changed (lint always runs)
        type: boolean
        default: false
      stack-paths:
        description: 'JSON object of extra path prefixes per stack, e.g. {"org": ["policies/"]}; <stack>/ is always included'
        type: string
        default: '{}'
      global-paths:
        description: JSON array of path prefixes that make every stack plan
        type: string
        default: '["backend.hcl", ".terraform-version", ".github/"]'

jobs:
  # No id-token here: third-party linters and their dependencies never see AWS credentials
  lint:
    name: lint (tflint + checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads hit the API rate limit without it
        run: |
          # --recursive resolves a relative --config per directory, so pass an absolute path
          config=()
          [ -f .tflint.hcl ] && config=(--config "$GITHUB_WORKSPACE/.tflint.hcl")
          tflint --init "${config[@]}"
          tflint --recursive --format compact "${config[@]}"

      # Reads .checkov.yaml from the repo root if present; --compact keeps code out of the log
      - name: checkov
        env:
          CHECKOV_VERSION: ${{ inputs.checkov-version }}
        run: |
          pipx install --quiet "checkov==${CHECKOV_VERSION}"
          set +e
          checkov --directory . --framework terraform --compact --quiet | tee checkov.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### checkov'
            echo '```'
            tail -c 60000 checkov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  changes:
    name: changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.changed-only && github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff needs the base commit

      # Prefix match in jq instead of a third-party changed-files action (tj-actions/changed-files, 2025)
      - name: Select stacks
        id: list
        shell: bash
        env:
          CHANGED_ONLY: ${{ inputs.changed-only && github.event_name == 'pull_request' }}
          STACKS: ${{ inputs.stacks }}
          STACK_PATHS: ${{ inputs.stack-paths }}
          GLOBAL_PATHS: ${{ inputs.global-paths }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$CHANGED_ONLY" != true ]; then
            stacks=$(jq -c . <<< "$STACKS")
          else
            # Three dots: what the PR branch changed since it forked, not newer commits on the base
            stacks=$(git diff --name-only "${BASE}...${HEAD}" | jq -R -s -c \
              --argjson all "$STACKS" --argjson extra "$STACK_PATHS" --argjson global "$GLOBAL_PATHS" '
              split("\n") | map(select(length > 0)) as $files
              | def touched($prefixes): any($files[]; . as $f | any($prefixes[]; . as $p | $f | startswith($p)));
                if touched($global) then $all
                else [$all[] | select(. as $s | touched([$s + "/"] + ($extra[$s] // [])))]
                end')
          fi
          echo "stacks=${stacks}" >> "$GITHUB_OUTPUT"
          echo "Stacks to plan: ${stacks}" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: plan # GitHub appends the matrix value; a skipped job has no matrix to show
    needs: [lint, changes] # cheap checks first: broken code never takes the state lock
    if: needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the default is 6 h; a stuck plan must not hold the state lock that long
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false # one broken stack must not hide the plans of the others
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    defaults:
      run:
        shell: bash # explicit shell adds -o pipefail: a failed plan piped into tee must fail the step
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Full reference on purpose: ./ would resolve against the caller's checkout, not this repo
      - uses: prohres/ci-templates/actions/tf-setup@feat/tf-output-mask # TEMP canary, revert before merge
        with:
          working-directory: ${{ matrix.stack }}
          gha-role-arn: ${{ inputs.gha-role-arn }}
          target-role-arn: ${{ inputs.target-role-arn }}
          target-account-id: ${{ inputs.target-account-id }}
          aws-region: ${{ inputs.aws-region }}
          backend-config: ${{ inputs.backend-config }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Post plan to the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STACK: ${{ matrix.stack }}
        run: |
          marker="<!-- tf-plan:${STACK} -->"
          {
            echo "$marker"
            echo "### terraform plan: \`${STACK}\`"
            grep -E '^(Plan:|No changes\.)' plan.txt || echo 'see job log'
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt # PR comments are capped at 65536 characters
            echo '```'
            echo '</details>'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            -q ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file comment.md
          fi

  # The one job to mark as required: it always runs, so a PR that plans no stack still reports
  # a result instead of leaving the required check "Expected — waiting" forever
  result:
    name: terraform-ok
    needs: [lint, changes, plan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        shell: bash
        env:
          LINT: ${{ needs.lint.result }}
          CHANGES: ${{ needs.changes.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "lint=${LINT} changes=${CHANGES} plan=${PLAN}"
          # plan is skipped when no stack changed; a plan skipped after a failed lint is caught by LINT
          [ "$LINT" = success ] && [ "$CHANGES" = success ] && [[ "$PLAN" =~ ^(success|skipped)$ ]]
